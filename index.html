
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasetsan Toptan Sipariş Formu</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; }
        .kasetsan-form-wrapper { padding: 20px; width: 100%; box-sizing: border-box; }
        .k-container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .k-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .k-form-group { display: flex; flex-direction: column; }
        .k-label { font-weight: 600; margin-bottom: 8px; font-size: 14px; color: #333; text-align: left; }
        .k-input, .k-textarea { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; width: 100%; box-sizing: border-box; }
        
        .k-tel-wrapper { position: relative; display: flex; align-items: center; }
        .k-tel-prefix { position: absolute; left: 12px; font-weight: bold; color: #777; }
        .k-tel-input { padding-left: 45px !important; }

        .k-full-width { grid-column: 1 / -1; }
        .k-textarea { height: 100px; resize: vertical; }

        .k-table-container { overflow-x: auto; margin-top: 20px; border: 1px solid #eee; border-radius: 10px; }
        .k-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .k-th { background-color: #2c3e50; color: white; padding: 15px; text-align: left; font-size: 14px; }
        .k-td { padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 14px; }

        .k-qty-control { display: flex; align-items: center; gap: 8px; }
        .k-btn-step { 
            width: 32px; height: 32px; border: 1px solid #3498db; background: white; 
            color: #3498db; font-weight: bold; cursor: pointer; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
        }
        .k-btn-step:hover { background: #3498db; color: white; }
        .k-qty-input { width: 60px; height: 32px; text-align: center; border: 1px solid #ddd; border-radius: 6px; font-weight: bold; }

        .k-badge { background: #e74c3c; color: white; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .k-total-bar { background: #2c3e50; color: white; padding: 20px; border-radius: 10px; margin-top: 20px; display: flex; justify-content: flex-end; gap: 30px; font-size: 18px; font-weight: bold; }
        .k-note { background: #fff3cd; border-left: 5px solid #f1c40f; padding: 15px; border-radius: 5px; margin-top: 25px; font-size: 14px; color: #856404; }
        .k-submit-btn { background-color: #27ae60; color: white; padding: 18px; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; margin-top: 20px; }
        
        @media (max-width: 600px) { .k-total-bar { flex-direction: column; gap: 10px; text-align: center; } }
    </style>
</head>
<body>

<div class="kasetsan-form-wrapper">
    <div class="k-container">
        <div class="k-info-grid">
            <div class="k-form-group">
                <label class="k-label">Şirket Unvanı *</label>
                <input type="text" id="firma" class="k-input" placeholder="Kasetsan LTD. ŞTİ." required>
            </div>
            <div class="k-form-group">
                <label class="k-label">Yetkili Adı Soyadı *</label>
                <input type="text" id="yetkili" class="k-input" placeholder="Ad Soyad" required>
            </div>
            <div class="k-form-group">
                <label class="k-label">Telefon Numarası *</label>
                <div class="k-tel-wrapper">
                    <span class="k-tel-prefix">+90</span>
                    <input type="tel" id="tel" class="k-input k-tel-input" placeholder="5XXXXXXXXX" maxlength="10" required>
                </div>
            </div>
            <div class="k-form-group">
                <label class="k-label">Vergi Dairesi *</label>
                <input type="text" id="vd" class="k-input" required>
            </div>
            <div class="k-form-group">
                <label class="k-label">Vergi Numarası *</label>
                <input type="text" id="vn" class="k-input" required>
            </div>
            <div class="k-form-group k-full-width">
                <label class="k-label">Teslimat Adresi *</label>
                <textarea id="adres" class="k-textarea" placeholder="Teslimat adresi..." required></textarea>
            </div>
        </div>

        <div class="k-table-container">
            <table class="k-table">
                <thead>
                    <tr>
                        <th class="k-th">Ürün</th>
                        <th class="k-th">Süre</th>
                        <th class="k-th">Koli İçi</th>
                        <th class="k-th">Sipariş</th>
                        <th class="k-th">Toplam</th>
                    </tr>
                </thead>
                <tbody id="product-list"></tbody>
            </table>
        </div>

        <div class="k-total-bar">
            <span>Toplam Koli: <span id="grand-koli">0</span></span>
            <span>Toplam Rulo: <span id="grand-rulo">0</span></span>
        </div>

        <div class="k-note">
            Sipariş detayları <strong>WhatsApp</strong> üzerinden iletilecektir.
        </div>

        <button type="button" class="k-submit-btn" id="send-btn">WhatsApp ile Gönder</button>
    </div>
</div>

<script>
    const urunler = [
        {ad: "37mmx30mt", koli: 630}, {ad: "56mmX12mt", koli: 630}, {ad: "56mmX13mt", koli: 630},
        {ad: "56mmX14mt", koli: 560}, {ad: "56mmX15mt", koli: 560}, {ad: "56mmX16mt", koli: 500},
        {ad: "56mmX20mt", koli: 350}, {ad: "56mmX25mt", koli: 340}, {ad: "56mmX30mt", koli: 290},
        {ad: "58mmX50mt", koli: 210}, {ad: "58mmX60mt", koli: 140}, {ad: "70mmx30mt", koli: 200},
        {ad: "70mmx40mt", koli: 150}, {ad: "75mmx30mt", koli: 200}, {ad: "75mmx40mt", koli: 150},
        {ad: "80mmX30mt", koli: 200}, {ad: "80mmX40mt", koli: 150}, {ad: "80mmX45mt", koli: 100},
        {ad: "80mmX60mt", koli: 100}, {ad: "80mmX80mt", koli: 96}, {ad: "100mmx30mt", koli: 150},
        {ad: "100mmx40mt", koli: 150}, {ad: "110mmX30mt", koli: 150}, {ad: "110mmX40mt", koli: 120},
        {ad: "110mmX50mt", koli: 100}
    ];

    const list = document.getElementById('product-list');
    const gKoli = document.getElementById('grand-koli');
    const gRulo = document.getElementById('grand-rulo');

    urunler.forEach((u, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="k-td"><strong>${u.ad}</strong></td>
            <td class="k-td"><span class="k-badge">2-3 Gün</span></td>
            <td class="k-td">${u.koli} Adet</td>
            <td class="k-td">
                <div class="k-qty-control">
                    <button type="button" class="k-btn-step minus" data-idx="${i}">-</button>
                    <input type="number" class="k-qty-input" value="0" data-idx="${i}" data-unit="${u.koli}">
                    <button type="button" class="k-btn-step plus" data-idx="${i}">+</button>
                </div>
            </td>
            <td class="k-td" id="r-${i}" style="font-weight:bold">0</td>
        `;
        list.appendChild(tr);
    });

    function update() {
        let tk = 0, tr = 0;
        document.querySelectorAll('.k-qty-input').forEach((inp, i) => {
            const v = parseInt(inp.value) || 0;
            const u = parseInt(inp.dataset.unit);
            const row = v * u;
            document.getElementById(`r-${i}`).innerText = row.toLocaleString('tr-TR');
            tk += v; tr += row;
        });
        gKoli.innerText = tk.toLocaleString('tr-TR');
        gRulo.innerText = tr.toLocaleString('tr-TR');
    }

    list.addEventListener('click', (e) => {
        if (e.target.classList.contains('k-btn-step')) {
            const inp = list.querySelector(`.k-qty-input[data-idx="${e.target.dataset.idx}"]`);
            let v = parseInt(inp.value) || 0;
            if (e.target.classList.contains('plus')) inp.value = v + 1;
            else if (v > 0) inp.value = v - 1;
            update();
        }
    });

    list.addEventListener('input', (e) => { if (e.target.classList.contains('k-qty-input')) update(); });

    document.getElementById('send-btn').addEventListener('click', () => {
        const f = document.getElementById('firma').value, y = document.getElementById('yetkili').value, 
              t = document.getElementById('tel').value, vd = document.getElementById('vd').value, 
              vn = document.getElementById('vn').value, a = document.getElementById('adres').value;
        const myNo = "905393930307"; // Numarayı buraya yazın

        if(!f || !y || !t || !a || !vd || !vn) { alert("Eksikleri doldurun!"); return; }

        let msg = `*KASETSAN SİPARİŞ*%0A%0A*Firma:* ${f}%0A*Yetkili:* ${y}%0A*Tel:* %2B90${t}%0A*V.D.:* ${vd}%0A*V.No:* ${vn}%0A*Adres:* ${a}%0A%0A*Ürünler:*%0A`;
        let has = false;
        document.querySelectorAll('.k-qty-input').forEach((inp, i) => {
            const v = parseInt(inp.value) || 0;
            if(v > 0) { has = true; msg += `• ${urunler[i].ad}: *${v} Koli*%0A`; }
        });
        msg += `%0A*Toplam:* ${gKoli.innerText} Koli`;
        if(!has) { alert("Ürün seçilmedi!"); return; }
        window.open(`https://wa.me/${myNo}?text=${msg}`, '_blank');
    });
</script>
</body>
</html>
